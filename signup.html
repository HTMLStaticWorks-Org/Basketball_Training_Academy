<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Registration — COURTLY Basketball Academy</title>
  <meta name="description" content="Create your Courtly Basketball Academy Athlete Profile. Join our structured training programs, schedule combine assessments, and begin your journey.">

    <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orange: {
              400: '#F3C04A',
              500: '#D4AF37',
              600: '#C59427',
            },
            court: {
              charcoal: '#12161C',
              dark: '#0A0D12',
              surface: '#151B24',
              border: '#252F3D',
              gold: '#D4AF37',
              goldHover: '#C59427',
              goldLight: '#F3C04A',
              cream: '#FDFBF7',
              grey: '#8E959E',
              lightBg: '#F8F9FA',
              lightSurface: '#FFFFFF',
              lightBorder: '#E2E6EA',
            }
          },
          fontFamily: {
            display: ['"Barlow Condensed"', 'sans-serif'],
            heading: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark bg-[#0A0D12] text-slate-100 font-body antialiased flex flex-col justify-between min-h-screen selection:bg-[#D4AF37] selection:text-black">

  <!-- Top Minimal Utility Bar (Theme toggle, RTL toggle) -->
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-end z-10">
    <div class="flex items-center gap-2.5">
      <!-- Theme Toggle -->
      <button class="theme-toggle-btn w-9 h-9 rounded-lg bg-surface border border-theme flex items-center justify-center text-slate-300 hover:text-orange-400 hover:border-orange-500/50 transition-all" aria-label="Toggle theme">
        <span class="theme-icon"><i data-lucide="sun" class="w-4 h-4"></i></span>
      </button>

      <!-- RTL Toggle with Bidirectional Arrows Icon -->
      <button class="rtl-toggle-btn w-9 h-9 rounded-lg bg-surface border border-theme flex items-center justify-center text-slate-300 hover:text-orange-400 hover:border-orange-500/50 transition-all" aria-label="Toggle layout direction" title="Toggle RTL/LTR Direction">
        <span class="rtl-toggle-icon flex items-center justify-center">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 3 4 4-4 4"/>
            <path d="M20 7H4"/>
            <path d="m8 21-4-4 4-4"/>
            <path d="M4 17h16"/>
          </svg>
        </span>
        <span class="sr-only rtl-toggle-text">RTL</span>
      </button>
    </div>
  </div>

  <!-- Centered Registration Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="w-full max-w-xl p-8 sm:p-10 rounded-3xl bg-[#151B24] border border-theme shadow-2xl">
      
      <!-- Centered Logo and Brand Name Inside the Card -->
      <div class="flex flex-col items-center text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-3 group mb-4">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-[#C59427] to-[#F3C04A] flex items-center justify-center shadow-lg shadow-amber-500/25 group-hover:scale-105 transition-transform flex-shrink-0">
            <!-- Geometric Basketball Icon -->
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M4.93 4.93l4.24 4.24"></path>
              <path d="M14.83 9.17l4.24-4.24"></path>
              <path d="M14.83 14.83l4.24 4.24"></path>
              <path d="M9.17 14.83L4.93 19.07"></path>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </div>
          <div class="flex flex-col text-left rtl:text-right">
            <span class="font-display font-black text-xl sm:text-2xl tracking-wider leading-none text-white dark:text-white group-hover:text-orange-500 transition-colors">COURTLY</span>
            <span class="text-[9px] sm:text-[10px] uppercase font-bold tracking-[0.25em] text-orange-400">Basketball Academy</span>
          </div>
        </a>
        <h2 class="text-xl font-bold font-display uppercase tracking-wider text-white mt-1">Athlete Registration</h2>
        <p class="text-xs text-slate-400 mt-1">Begin your path to collegiate and professional basketball development.</p>
      </div>

      <!-- Registration Form -->
      <form id="courtlySignupForm" class="space-y-4">
        
        <!-- First & Last Name -->
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">First Name *</label>
            <input type="text" id="signupFirstName" required placeholder="Marcus" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Last Name *</label>
            <input type="text" id="signupLastName" required placeholder="Vance" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
          </div>
        </div>

        <!-- Email & Phone -->
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Email Address *</label>
            <input type="email" id="signupEmail" required placeholder="marcus.vance@domain.com" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Phone Number *</label>
            <input type="tel" id="signupPhone" required placeholder="+1 (555) 234-8901" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
          </div>
        </div>

        <!-- Date of Birth & Age Group -->
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Date of Birth *</label>
            <input type="date" id="signupDob" required value="2005-08-14" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Player Age Group *</label>
            <select id="signupAgeGroup" required class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
              <option value="">Select Age Group</option>
              <option value="U-10">U-10 Junior Cadets</option>
              <option value="U-12">U-12 Rising Stars</option>
              <option value="U-15">U-15 Middle School</option>
              <option value="U-18" selected>U-18 High School / Varsity</option>
              <option value="U-21">U-21 Collegiate / Open</option>
            </select>
          </div>
        </div>

        <!-- Experience Level -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Basketball Experience Level *</label>
          <select id="signupExperience" required class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors">
            <option value="">Select Experience Level</option>
            <option value="Beginner">Beginner (1-2 Years Recreational)</option>
            <option value="Intermediate">Intermediate (School Team / Travel Ball)</option>
            <option value="Advanced" selected>Advanced (Varsity Starter / AAU Competitor)</option>
            <option value="Elite">Elite (Collegiate / Pro Prospect)</option>
          </select>
        </div>

        <!-- Password with Eye Icon -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Password *</label>
          <div class="relative">
            <input type="password" id="signupPassword" required value="Courtly2026!" placeholder="••••••••" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors pr-10">
            <button type="button" class="pwd-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-500 hover:bg-orange-500/10 rounded-lg p-1.5 transition-all duration-200" data-target="signupPassword" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password with Eye Icon -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Confirm Password *</label>
          <div class="relative">
            <input type="password" id="signupConfirmPassword" required value="Courtly2026!" placeholder="••••••••" class="w-full h-[46px] px-4 py-3 rounded-xl bg-black/40 border border-theme text-sm text-white focus:outline-none focus:border-orange-500 transition-colors pr-10">
            <button type="button" class="pwd-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-500 hover:bg-orange-500/10 rounded-lg p-1.5 transition-all duration-200" data-target="signupConfirmPassword" aria-label="Toggle confirm password visibility">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="pt-1">
          <label class="flex items-start gap-2.5 cursor-pointer text-xs text-slate-300">
            <input type="checkbox" required checked class="w-4 h-4 mt-0.5 rounded bg-black/40 border-theme text-orange-500 focus:ring-0">
            <span>I agree to the <a href="#" class="text-orange-400 hover:text-orange-500 hover:underline underline-offset-4 transition-colors duration-200 font-semibold">Terms & Conditions</a>, Athlete Code of Conduct, and Academy Medical Release.</span>
          </label>
        </div>

        <!-- Create Account Button -->
        <button type="submit" id="signupSubmitBtn" class="w-full btn-court-primary py-4 rounded-xl text-xs uppercase font-bold tracking-widest mt-3">
          <span>Create Account & Initialize Profile</span>
          <i data-lucide="arrow-right" class="w-4 h-4 ltr-only-icon"></i>
        </button>

      </form>

      <!-- Icon-Only Social Signups with Hover Effects -->
      <div class="mt-8 pt-6 border-t border-theme/60 text-center">
        <span class="text-xs text-slate-400 block mb-4">Or sign up with</span>
        
        <div class="flex items-center justify-center gap-4">
          <button type="button" class="social-icon-btn social-google bg-black/40 border border-theme text-slate-300" aria-label="Sign up with Google" onclick="demoSocialSignup('Google')">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
          </button>

          <button type="button" class="social-icon-btn social-facebook bg-black/40 border border-theme text-slate-300" aria-label="Sign up with Facebook" onclick="demoSocialSignup('Facebook')">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.374 14.5 5 15.5 5H18V0h-3.808C10.595 0 9 1.583 9 4.615V8z"/></svg>
          </button>

          <button type="button" class="social-icon-btn social-apple bg-black/40 border border-theme text-slate-300" aria-label="Sign up with Apple" onclick="demoSocialSignup('Apple')">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.02-.49 2.64-1.24z"/></svg>
          </button>
        </div>
      </div>

      <!-- Link to Login -->
      <div class="mt-6 text-center text-xs text-slate-400">
        Already have an athlete profile?
        <a href="login.html" class="text-orange-400 hover:text-orange-500 hover:underline underline-offset-4 transition-colors duration-200 font-bold ml-1">Sign In Here</a>
      </div>

    </div>
  </main>

  <!-- Bottom Minimal Footer -->
  <footer class="py-4 text-center text-xs text-slate-400">
    © 2026 COURTLY Basketball Academy. Official Registration Portal.
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script>
    lucide.createIcons();

    // Eye toggles for both fields
    document.querySelectorAll('.pwd-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          btn.innerHTML = isPwd ? `<i data-lucide="eye-off" class="w-4 h-4"></i>` : `<i data-lucide="eye" class="w-4 h-4"></i>`;
          lucide.createIcons();
        }
      });
    });

    // Signup Submit handler
    const signupForm = document.getElementById('courtlySignupForm');
    if (signupForm) {
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const pwd = document.getElementById('signupPassword').value;
        const confirmPwd = document.getElementById('signupConfirmPassword').value;

        if (pwd !== confirmPwd) {
          showCourtlyToast('Password Mismatch', 'Your passwords do not match.', 'error');
          return;
        }

        const firstName = document.getElementById('signupFirstName').value;
        const lastName = document.getElementById('signupLastName').value;
        const email = document.getElementById('signupEmail').value;
        const phone = document.getElementById('signupPhone').value;
        const ageGroup = document.getElementById('signupAgeGroup').value;
        const experience = document.getElementById('signupExperience').value;

        const newPlayer = {
          name: `${firstName} ${lastName}`,
          id: 'CT-2026-' + Math.floor(10 + Math.random() * 90),
          email,
          phone,
          dob: document.getElementById('signupDob').value,
          ageGroup,
          experience,
          position: 'Point Guard / Guard',
          jerseyNumber: '08',
          height: `6'2"`,
          weight: '185 lbs',
          academyRank: 'Tier 1 Prospect',
          attendanceRate: '100%',
          totalSessions: 1,
          hoursTrained: 2,
          skillRating: 82,
          coach: 'Head Coach Marcus Hayes',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'
        };

        localStorage.setItem('courtly_player', JSON.stringify(newPlayer));

        const btn = document.getElementById('signupSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block mr-2">⟳</span> Generating Roster Profile...`;

        setTimeout(() => {
          showCourtlyToast('Account Created!', `Welcome to Courtly Academy, ${firstName}!`, 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }, 800);
      });
    }

    function demoSocialSignup(provider) {
      showCourtlyToast(`${provider} Connect`, `Connecting account via ${provider}...`, 'info');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 900);
    }
  </script>
</body>
</html>
